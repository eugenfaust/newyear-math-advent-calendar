security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            stateless: true
            custom_authenticators:
                - App\User\Security\BearerAuthenticator
            entry_point: App\User\Security\ApiAuthenticationEntryPoint
            access_denied_handler: App\User\Security\ApiAccessDeniedHandler
    access_control:
        - { path: ^/api/v1/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/api/v1(?:/|$), roles: ROLE_USER }

