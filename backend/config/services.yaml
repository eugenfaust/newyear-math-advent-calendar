parameters:
    app.timezone: '%env(APP_TIMEZONE)%'
    uploads_dir: '%env(UPLOADS_DIR)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Task\Storage\ImageStorage: '@App\Task\Storage\LocalImageStorage'
    App\Calendar\Service\CalendarAvailability:
        arguments:
            $businessTimezone: '%app.timezone%'
    App\Task\Storage\LocalImageStorage:
        arguments:
            $uploadsDir: '%uploads_dir%'
    App\Ornament\Storage\OrnamentImageStorage: '@App\Ornament\Storage\LocalOrnamentImageStorage'
    App\Ornament\Storage\LocalOrnamentImageStorage:
        arguments:
            $uploadsDir: '%uploads_dir%'

